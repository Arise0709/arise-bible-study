name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Install browser
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils unzip
      - name: Browser tests
        run: |
          npx vite preview --port 4173 --strictPort --host 127.0.0.1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          node e2e/acceptance.cjs http://127.0.0.1:4173
